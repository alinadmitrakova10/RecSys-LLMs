name: Deploy Week 3 to GitHub Pages

on:
  push:
    branches:
      - alina-03-collaborative-filtering
    paths:
      - "week2/**"
      - "week3/**"
      - "week3/pages/**"
      - ".github/workflows/deploy-week3.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Build Pages site
        run: |
          mkdir site
          cp week3/pages/index.html site/index.html
          cp -R week2 site/week2
          cp -R week3 site/week3
      - name: Upload Weeks 2 and 3
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
