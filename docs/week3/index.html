<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Collaborative Filtering Movie Recommender</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Collaborative Filtering<br>Movie Recommender</h1>
            <p class="subtitle">Pick a user and a movie to predict a rating using<br>User-Based and Item-Based CF</p>
        </header>

        <main>
            <div class="search-row">
                <div class="input-group">
                    <label class="field-label" for="user-input">User</label>
                    <div class="search-wrapper">
                        <input type="text" id="user-input" placeholder="Select User" autocomplete="off">
                        <button type="button" id="user-clear" class="clear-btn" title="Clear selection">×</button>
                        <div id="user-suggestions" class="suggestions-dropdown"></div>
                    </div>
                </div>

                <div class="input-group">
                    <label class="field-label" for="movie-input">Movie</label>
                    <div class="search-wrapper">
                        <input type="text" id="movie-input" placeholder="Select Movie" autocomplete="off">
                        <button type="button" id="movie-clear" class="clear-btn" title="Clear selection">×</button>
                        <div id="movie-suggestions" class="suggestions-dropdown"></div>
                    </div>
                </div>
            </div>

            <div class="btn-row">
                <button id="predict-btn" onclick="predictRating()" disabled>Predict Rating</button>
            </div>

            <div id="result" class="result"></div>
            <div id="status" class="status">Loading data</div>
        </main>
    </div>

    <script src="data.js"></script>
    <script src="script.js"></script>
</body>
</html>
